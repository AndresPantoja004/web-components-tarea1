<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Componente Card Product</title>
</head>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(135deg, #7461ef, #f2fd5e);
  }
  product-card {
    width: 300px;
    height: 400px;
  }

  .add-to-cart{
    background-color: var(--primary-color, #4CAF50);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    width: 100%;
  }
</style>
<body>
  
  <product-card
    title="CUTE TODDLER SHOES"
    price="182"
    image="https://static.vecteezy.com/system/resources/thumbnails/046/323/598/small_2x/pair-of-colorful-sports-shoes-for-active-lifestyle-png.png"
    category="Kids Fashion"
    description="Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris."
    rating="4"
    style="--bg-base: #009688; --bg-button: #ff5722; --text-color: rgb(14, 14, 14);"
  ></product-card>

  <product-card price="59.99" rating="5" bg-base="green" bg-button="red">
  <span slot="title">Zapatillas Deportivas</span>
  <span slot="description">Ideales para correr y entrenar y hacer demasiadas cosas.</span>
  <span slot="category">Calzado</span>
  <img slot="image" src="https://static.vecteezy.com/system/resources/thumbnails/046/323/598/small_2x/pair-of-colorful-sports-shoes-for-active-lifestyle-png.png" alt="Zapatillas">
  <button slot="button" class="add-to-cart">Comprar ahora</button>
</product-card>

  <script src="product-card.js"></script>
</body>
</html>
